# dnsmasq in proxy-DHCP mode: the existing DHCP server keeps handing out IPs,
# dnsmasq only tells UEFI clients where to find iPXE.
# CHANGE: 192.168.1.0 = your network, 192.168.1.10 = this server.

port=0                                   # no DNS
dhcp-range=192.168.1.0,proxy
enable-tftp
tftp-root=/srv/tftp
dhcp-userclass=set:ipxe,iPXE

# Step 1: UEFI firmware (no iPXE yet) → load iPXE via TFTP
pxe-service=tag:!ipxe,X86-64_EFI,"EasyLinux",ipxe.efi
# Step 2: iPXE is running → load the EasyLinux boot script over HTTP
pxe-service=tag:ipxe,X86-64_EFI,"EasyLinux",http://192.168.1.10/easylinux/boot.ipxe

log-dhcp
