# Builds the USB ISO and PXE files, test-installs both OSes in a VM, publishes a Release.
#  - monthly: only if newer versions exist (nixpkgs / NixOS / Debian release)
#  - on push of code changes: always
#  - manually: "Run workflow"
name: Build ISO

on:
  schedule:
    - cron: "23 4 1 * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "installer/**"
      - "live-image/**"
      - "flake.nix"
      - "flake.lock"
      - "tools/ci-*"
      - ".github/workflows/build.yml"

permissions:
  contents: write

concurrency:
  group: build-iso
  cancel-in-progress: false

jobs:
  prepare:
    name: Check for updates
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.decide.outputs.build }}
      sha: ${{ steps.decide.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Newest stable releases and packages
        if: github.event_name != 'push'
        run: |
          python3 tools/update-releases.py
          nix flake update
      - name: Create lock file if missing
        run: test -f flake.lock || nix flake lock
      - name: Commit updates
        id: decide
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add releases.yaml flake.nix flake.lock
          changed=false
          if ! git diff --cached --quiet; then
            git commit -m "Update to newest stable releases and packages"
            git push
            changed=true
          fi
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$changed" = false ]; then
            echo "No updates this month, nothing to build."
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    name: Build ISO and PXE files
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ needs.prepare.outputs.sha }}" }
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Build
        run: |
          nix build .#iso -o result-iso -L
          nix build .#netboot -o result-netboot -L
          mkdir out
          cp result-iso/iso/*.iso out/easylinux-x86_64.iso
          cp result-netboot/* out/
          ls -lh out
      - name: Size check (GitHub Release files must be under 2 GiB)
        run: |
          for f in out/*; do
            size=$(stat -c %s "$f")
            if [ "$size" -ge 2147483648 ]; then echo "$f is too big: $size bytes"; exit 1; fi
          done
      - uses: actions/upload-artifact@v4
        with:
          name: images
          path: out/
          retention-days: 7
          compression-level: 0

  test:
    name: Test install (${{ matrix.os }})
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        os: [debian, nixos]
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ needs.prepare.outputs.sha }}" }
      - uses: actions/download-artifact@v4
        with: { name: images, path: out }
      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils ovmf
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm || true
      - name: Install test profile and boot it
        run: bash tools/ci-vm-test.sh "test-${{ matrix.os }}" "${{ needs.prepare.outputs.sha }}" out/easylinux-x86_64.iso
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: serial-logs-${{ matrix.os }}
          path: "*-serial.log"

  release:
    name: Publish release
    needs: [prepare, build, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { name: images, path: out }
      - name: Checksums and tag
        id: tag
        run: |
          (cd out && sha256sum * > SHA256SUMS)
          echo "tag=v$(date -u +%Y.%m.%d)-${{ github.run_number }}" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          target_commitish: ${{ needs.prepare.outputs.sha }}
          name: EasyLinux ${{ steps.tag.outputs.tag }}
          make_latest: true
          body: |
            USB stick: write `easylinux-x86_64.iso` with balenaEtcher, or Rufus in **DD mode**. UEFI only, Secure Boot off.
            PXE: `bzImage`, `initrd`, `netboot.ipxe` (see `pxe/README.md`).
          files: out/*

  pages:
    name: Download page
    needs: release
    runs-on: ubuntu-latest
    continue-on-error: true      # needs Settings → Pages → Source: GitHub Actions
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: docs }
      - uses: actions/deploy-pages@v4
